name: Build and deploy site

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_USERNAME: ${{ github.repository_owner }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Refresh projects for polling
        if: github.event_name != 'push'
        run: npm run refresh-projects -- --require-fresh

      - name: Refresh projects on main updates
        if: github.event_name == 'push'
        run: npm run refresh-projects

      - name: Build site
        run: npm run build:site

      - name: Commit refreshed project snapshot to main
        run: |
          if git diff --quiet -- src/_data/projects.json; then
            echo "Project snapshot is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/_data/projects.json
            git commit -m "chore: refresh projects snapshot [skip ci]"
            git push origin HEAD:refs/heads/main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
